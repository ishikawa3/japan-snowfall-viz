<style>
  :root {
    --bg: #0b1020;
    --surface: rgba(17, 24, 44, 0.82);
    --surface-solid: #11182c;
    --text-primary: #eaf1ff;
    --text-secondary: #a9b6d6;
    --text-muted: #6c7aa0;
    --border: rgba(160, 180, 230, 0.18);
    --accent: #5ec8e8;
    --title-h: 60px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Yu Gothic", sans-serif;
    color: var(--text-primary);
    background: var(--bg);
  }

  #scene { position: absolute; inset: 0; display: block; }

  .panel {
    position: absolute;
    z-index: 2;
    background: var(--surface);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }

  /* --- タイトル(左上) --- */
  #title-panel {
    top: 12px;
    left: 12px;
    padding: 14px 16px;
    max-width: 320px;
  }
  #title-panel h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #title-panel h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    flex: 0 0 auto;
  }
  #title-panel p {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.55;
  }
  #title-panel a { color: var(--accent); text-decoration: none; }
  #title-panel a:hover { text-decoration: underline; }

  /* --- コントロール(右上) --- */
  #controls {
    top: 12px;
    right: 12px;
    padding: 12px 14px;
    width: 220px;
  }
  #controls .group { margin-bottom: 14px; }
  #controls .group:last-child { margin-bottom: 0; }
  #controls .label {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    flex: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 7px 4px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { background: rgba(94, 200, 232, 0.10); }
  .seg button.active {
    background: rgba(94, 200, 232, 0.22);
    color: var(--text-primary);
    font-weight: 600;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
  }
  .check input { accent-color: var(--accent); width: 15px; height: 15px; }

  /* --- 凡例(左下) --- */
  #legend {
    left: 12px;
    bottom: 12px;
    padding: 12px 14px;
    width: 240px;
  }
  #legend .label {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  #legend .bar {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg,
      #14357a 0%, #2f7ad1 40%, #5ec8e8 70%, #f0fbff 100%);
  }
  #legend .ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 11px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  #legend .note {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* --- ツールチップ --- */
  #tooltip {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transition: opacity 0.12s;
    max-width: 240px;
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-name { font-weight: 700; margin-bottom: 2px; }
  #tooltip .tt-val {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  #tooltip .tt-sub { color: var(--text-muted); font-size: 11px; }

  /* --- ローディング --- */
  #loading {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: var(--bg);
    color: var(--text-secondary);
    font-size: 14px;
  }
  #loading.hide { display: none; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(94, 200, 232, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* --- フッター（出典） --- */
  #credit {
    right: 12px;
    bottom: 12px;
    padding: 8px 12px;
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.5;
    max-width: 300px;

  #credit a { color: var(--text-secondary); text-decoration: none; }

  @media (max-width: 640px) {
    #title-panel { max-width: calc(100vw - 24px); }
    #controls { width: 180px; }
    #legend { width: calc(100vw - 24px); }
    #credit { display: none; }

<body>
<canvas id="scene"></canvas>

<div id="title-panel" class="panel">
  <h1><span class="dot"></span>日本の豪雪 3Dビュー</h1>
  <p>
    気象観測点の積雪データを高さで立体化しています。ドラッグで回転、
    ホイール/ピンチでズーム。マウスを乗せると観測点の詳細を表示します。
    <br />
    <a href="./index.html">← 2D地図版を見る</a>
  </p>
</div>

<div id="controls" class="panel">
  <div class="group">
    <div class="label">データセット</div>
    <div class="seg" id="seg-dataset">
      <button data-ds="maxdepth" class="active">最深積雪</button>
      <button data-ds="snowfall">累計降雪量</button>
    </div>
  </div>
  <div class="group">
    <div class="label">指標</div>
    <div class="seg" id="seg-metric">
      <button data-metric="avg" class="active">累年平均</button>
      <button data-metric="max">累年最大</button>
      <button data-metric="latest">最新年</button>
    </div>
  </div>
  <div class="group">
    <label class="check">
      <input type="checkbox" id="chk-regions" checked />
      豪雪地帯の指定区域を表示
    </label>
  </div>
  <div class="group">
    <label class="check">
      <input type="checkbox" id="chk-rotate" />
      自動回転
    </label>
  </div>
</div>

<div id="legend" class="panel">
  <div class="label" id="legend-title">最深積雪・累年平均 (cm)</div>
  <div class="bar"></div>
  <div class="ticks"><span id="tick-min">0</span><span id="tick-mid">—</span><span id="tick-max">—</span></div>
  <div class="note" id="legend-count">— 地点</div>
</div>

<div id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-val"></div>
  <div class="tt-sub"></div>
</div>

<div id="credit" class="panel">
  データ: <a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A22-m.html" target="_blank" rel="noopener">国土数値情報 豪雪地帯データ(気象データ等)A22-m-14</a> / A22-2016(国土交通省)。可視化: Three.js + WebGL。
</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">データを読み込んでいます…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------------------
// 定数・状態
// ---------------------------------------------------------------------------
const MAP_WIDTH = 130;          // 投影後の地図の目標横幅(ワールド単位)
const TARGET_MAX_HEIGHT = 46;   // 最も高いカラムの目標高さ
const BAR_RADIUS = 0.34;        // カラムの半径

const state = {
  dataset: "maxdepth",   // "maxdepth" | "snowfall"
  metric: "avg",         // "avg" | "max" | "latest"
  showRegions: true,
  autoRotate: false,
};

const DS_LABEL = { maxdepth: "最深積雪", snowfall: "累計降雪量" };
const METRIC_LABEL = { avg: "累年平均", max: "累年最大", latest: "最新年" };

// 色ランプ(寒色 → 氷白)。低い値=深いブルー、高い値=氷白。
const RAMP = [
  { t: 0.0, c: [0x14, 0x35, 0x7a] },
  { t: 0.4, c: [0x2f, 0x7a, 0xd1] },
  { t: 0.7, c: [0x5e, 0xc8, 0xe8] },
  { t: 1.0, c: [0xf0, 0xfb, 0xff] },
];
function rampColor(t, out) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i].t) {
      const a = RAMP[i - 1], b = RAMP[i];
      const f = (t - a.t) / (b.t - a.t || 1);
      out.setRGB(
        (a.c[0] + (b.c[0] - a.c[0]) * f) / 255,
        (a.c[1] + (b.c[1] - a.c[1]) * f) / 255,
        (a.c[2] + (b.c[2] - a.c[2]) * f) / 255,
        THREE.SRGBColorSpace
      );
      return out;
    }
  }
  out.setRGB(RAMP[3].c[0] / 255, RAMP[3].c[1] / 255, RAMP[3].c[2] / 255, THREE.SRGBColorSpace);
  return out;
}

// ---------------------------------------------------------------------------
// three.js セットアップ
// ---------------------------------------------------------------------------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 160, 340);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.set(0, 90, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;   // 地面より下に回り込まない
controls.minDistance = 20;
controls.maxDistance = 320;
controls.autoRotateSpeed = 0.5;

// ライト
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x0a0f1e, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(60, 120, 40);
scene.add(dir);

// 地面グリッド
const grid = new THREE.GridHelper(MAP_WIDTH * 1.6, 40, 0x22304f, 0x18223a);
grid.position.y = -0.02;
scene.add(grid);

// ---------------------------------------------------------------------------
// 投影(経度緯度 → ワールドXZ 平面)
// ---------------------------------------------------------------------------
let proj = null; // { lon0, lat0, k }
function project(lon, lat) {
  const x = (lon - proj.lon0) * Math.cos((proj.lat0 * Math.PI) / 180) * proj.k;
  const z = -(lat - proj.lat0) * proj.k; // 北を -Z(画面奥)へ
  return [x, z];
}

function computeProjection(bounds) {
  const { minLon, maxLon, minLat, maxLat } = bounds;
  const lon0 = (minLon + maxLon) / 2;
  const lat0 = (minLat + maxLat) / 2;
  const lonSpan = (maxLon - minLon) * Math.cos((lat0 * Math.PI) / 180);
  const k = MAP_WIDTH / (lonSpan || 1);
  proj = { lon0, lat0, k };
}

// ---------------------------------------------------------------------------
// データ読み込み
// ---------------------------------------------------------------------------
const datasets = {};    // ds -> [{name, addr, org, avg, max, latest, latestYear, x, z}]
let regionsGroup = null;

async function loadAll() {
  const [maxdepth, snowfall, gosetsu] = await Promise.all([
    fetch("./data/stations_maxdepth.geojson").then((r) => r.json()),
    fetch("./data/stations_snowfall.geojson").then((r) => r.json()),
    fetch("./data/gosetsu.geojson").then((r) => r.json()),
  ]);

  // 全データの経度緯度範囲を求める
  const b = { minLon: Infinity, maxLon: -Infinity, minLat: Infinity, maxLat: -Infinity };
  const scan = (lon, lat) => {
    if (lon < b.minLon) b.minLon = lon;
    if (lon > b.maxLon) b.maxLon = lon;
    if (lat < b.minLat) b.minLat = lat;
    if (lat > b.maxLat) b.maxLat = lat;
  };
  for (const fc of [maxdepth, snowfall]) {
    for (const f of fc.features) scan(f.geometry.coordinates[0], f.geometry.coordinates[1]);
  }
  computeProjection(b);

  // 観測点を配列化(投影座標付き)
  for (const [ds, fc] of [["maxdepth", maxdepth], ["snowfall", snowfall]]) {
    datasets[ds] = fc.features.map((f) => {
      const [lon, lat] = f.geometry.coordinates;
      const [x, z] = project(lon, lat);
      const p = f.properties;
      return {
        name: p.name, addr: p.addr, org: p.org,
        avg: p.avg, max: p.max, latest: p.latest, latestYear: p.latestYear,
        x, z,
      };
    });
  }

  buildRegions(gosetsu);
}

// 指定区域ポリゴンを地面のアウトラインとして描く
function buildRegions(gosetsu) {
  const positions = [];
  const addRing = (ring) => {
    for (let i = 0; i < ring.length - 1; i++) {
      const [ax, az] = project(ring[i][0], ring[i][1]);
      const [bx, bz] = project(ring[i + 1][0], ring[i + 1][1]);
      positions.push(ax, 0.02, az, bx, 0.02, bz);
    }
  };
  for (const f of gosetsu.features) {
    const g = f.geometry;
    if (!g) continue;
    if (g.type === "MultiPolygon") {
      for (const poly of g.coordinates) for (const ring of poly) addRing(ring);
    } else if (g.type === "Polygon") {
      for (const ring of g.coordinates) addRing(ring);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0x3f6bb0, transparent: true, opacity: 0.55,
  });
  regionsGroup = new THREE.LineSegments(geo, mat);
  regionsGroup.visible = state.showRegions;
  scene.add(regionsGroup);
}

// ---------------------------------------------------------------------------
// カラム(InstancedMesh)
// ---------------------------------------------------------------------------
let bars = null;
let current = [];       // 現在描画中の観測点配列
let currentMax = 1;     // 現在の指標の最大値
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

const barGeo = new THREE.CylinderGeometry(BAR_RADIUS, BAR_RADIUS, 1, 10);
const barMat = new THREE.MeshStandardMaterial({
  roughness: 0.45, metalness: 0.05, vertexColors: false,
});

function valueOf(d) {
  const v = d[state.metric];
  return typeof v === "number" && isFinite(v) ? v : null;
}

function rebuildBars() {
  const raw = datasets[state.dataset] || [];
  current = raw.filter((d) => valueOf(d) != null);
  currentMax = current.reduce((m, d) => Math.max(m, valueOf(d)), 1);

  if (bars) { scene.remove(bars); bars.geometry.dispose?.(); bars.dispose?.(); }

  bars = new THREE.InstancedMesh(barGeo, barMat, current.length);
  bars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  const hScale = TARGET_MAX_HEIGHT / currentMax;
  for (let i = 0; i < current.length; i++) {
    const d = current[i];
    const v = valueOf(d);
    const h = Math.max(0.4, v * hScale);
    dummy.position.set(d.x, h / 2, d.z);
    dummy.scale.set(1, h, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    bars.setMatrixAt(i, dummy.matrix);
    rampColor(v / currentMax, tmpColor);
    bars.setColorAt(i, tmpColor);
  }
  bars.instanceMatrix.needsUpdate = true;
  if (bars.instanceColor) bars.instanceColor.needsUpdate = true;
  scene.add(bars);

  updateLegend();
}

// ---------------------------------------------------------------------------
// 凡例
// ---------------------------------------------------------------------------
function updateLegend() {
  const unit = "cm";
  document.getElementById("legend-title").textContent =
    `${DS_LABEL[state.dataset]}・${METRIC_LABEL[state.metric]} (${unit})`;
  document.getElementById("tick-min").textContent = "0";
  document.getElementById("tick-mid").textContent =
    Math.round(currentMax / 2).toLocaleString();
  document.getElementById("tick-max").textContent =
    Math.round(currentMax).toLocaleString();
  document.getElementById("legend-count").textContent =
    `${current.length.toLocaleString()} 地点`;
}

// ---------------------------------------------------------------------------
// ホバー(レイキャスト)
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltip = document.getElementById("tooltip");
let hoverId = -1;
let pointerInside = false;

function onPointerMove(e) {
  pointerInside = true;
  pointer.px = e.clientX;
  pointer.py = e.clientY;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
renderer.domElement.addEventListener("pointermove", onPointerMove);
renderer.domElement.addEventListener("pointerleave", () => {
  pointerInside = false;
  hoverId = -1;
  tooltip.classList.remove("show");
});

function updateHover() {
  if (!pointerInside || !bars) return;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(bars);
  if (hits.length && hits[0].instanceId != null) {
    const id = hits[0].instanceId;
    if (id !== hoverId) {
      hoverId = id;
      const d = current[id];
      const v = valueOf(d);
      tooltip.querySelector(".tt-name").textContent = d.name || "(名称不明)";
      tooltip.querySelector(".tt-val").textContent =
        `${Math.round(v).toLocaleString()} cm — ${DS_LABEL[state.dataset]}・${METRIC_LABEL[state.metric]}`;
      const yr = state.metric === "latest" && d.latestYear ? `(${d.latestYear}年度) ` : "";
      tooltip.querySelector(".tt-sub").textContent =
        `${yr}${d.addr || ""}${d.org ? " / " + d.org : ""}`;
    }
    tooltip.style.left = pointer.px + 14 + "px";
    tooltip.style.top = pointer.py + 14 + "px";
    tooltip.classList.add("show");
  } else {
    hoverId = -1;
    tooltip.classList.remove("show");
  }
}

// ---------------------------------------------------------------------------
// UI 配線
// ---------------------------------------------------------------------------
function wireSeg(id, key, onChange) {
  const el = document.getElementById(id);
  el.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...el.children].forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    onChange(btn.dataset[key]);
  });
}
wireSeg("seg-dataset", "ds", (v) => { state.dataset = v; rebuildBars(); });
wireSeg("seg-metric", "metric", (v) => { state.metric = v; rebuildBars(); });

document.getElementById("chk-regions").addEventListener("change", (e) => {
  state.showRegions = e.target.checked;
  if (regionsGroup) regionsGroup.visible = state.showRegions;
});
document.getElementById("chk-rotate").addEventListener("change", (e) => {
  state.autoRotate = e.target.checked;
  controls.autoRotate = state.autoRotate;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// ループ
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateHover();
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
(async function init() {
  try {
    await loadAll();
    rebuildBars();
    document.getElementById("loading").classList.add("hide");
    animate();
  } catch (err) {
    console.error(err);
    document.getElementById("loading-text").textContent =
      "データの読み込みに失敗しました: " + (err && err.message ? err.message : err);
  }
})();
</script>
</body>
</html>
