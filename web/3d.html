<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------------------
// 定数・状態
// ---------------------------------------------------------------------------
const MAP_WIDTH = 130;          // 投影後の地図の目標横幅(ワールド単位)
const TARGET_MAX_HEIGHT = 46;   // 最も高いカラムの目標高さ
const BAR_RADIUS = 0.34;        // カラムの半径

const state = {
  dataset: "maxdepth",   // "maxdepth" | "snowfall"
  metric: "avg",         // "avg" | "max" | "latest"
  regionMode: "outline", // "none" | "outline" | "filled"
  threshold: 0,          // 高さフィルタ(この値[cm]以上のみ表示)
  autoRotate: false,
};

// 指定区域の塗り分け色(2D版のパレットに合わせる)
const REGION_FILL = { "1": 0x86b6ef, "2": 0x1c5cab };  // 豪雪地帯 / 特別豪雪地帯
// 選択ハイライト色(寒色ランプと対比する暖色)
const HIGHLIGHT = 0xffb454;

const DS_LABEL = { maxdepth: "最深積雪", snowfall: "累計降雪量" };
const METRIC_LABEL = { avg: "累年平均", max: "累年最大", latest: "最新年" };

// 色ランプ(寒色 → 氷白)。低い値=深いブルー、高い値=氷白。
const RAMP = [
  { t: 0.0, c: [0x14, 0x35, 0x7a] },
  { t: 0.4, c: [0x2f, 0x7a, 0xd1] },
  { t: 0.7, c: [0x5e, 0xc8, 0xe8] },
  { t: 1.0, c: [0xf0, 0xfb, 0xff] },
];
function rampColor(t, out) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i].t) {
      const a = RAMP[i - 1], b = RAMP[i];
      const f = (t - a.t) / (b.t - a.t || 1);
      out.setRGB(
        (a.c[0] + (b.c[0] - a.c[0]) * f) / 255,
        (a.c[1] + (b.c[1] - a.c[1]) * f) / 255,
        (a.c[2] + (b.c[2] - a.c[2]) * f) / 255,
        THREE.SRGBColorSpace
      );
      return out;
    }
  }
  out.setRGB(RAMP[3].c[0] / 255, RAMP[3].c[1] / 255, RAMP[3].c[2] / 255, THREE.SRGBColorSpace);
  return out;
}

// ---------------------------------------------------------------------------
// three.js セットアップ
// ---------------------------------------------------------------------------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 160, 340);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.set(0, 90, 120);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;   // 地面より下に回り込まない
controls.minDistance = 20;
controls.maxDistance = 320;
controls.autoRotateSpeed = 0.5;

// ライト
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x0a0f1e, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(60, 120, 40);
scene.add(dir);

// 地面グリッド
const grid = new THREE.GridHelper(MAP_WIDTH * 1.6, 40, 0x22304f, 0x18223a);
grid.position.y = -0.02;
scene.add(grid);

// ---------------------------------------------------------------------------
// 投影(経度緯度 → ワールドXZ 平面)
// ---------------------------------------------------------------------------
let proj = null; // { lon0, lat0, k }
function project(lon, lat) {
  const x = (lon - proj.lon0) * Math.cos((proj.lat0 * Math.PI) / 180) * proj.k;
  const z = -(lat - proj.lat0) * proj.k; // 北を -Z(画面奥)へ
  return [x, z];
}

function computeProjection(bounds) {
  const { minLon, maxLon, minLat, maxLat } = bounds;
  const lon0 = (minLon + maxLon) / 2;
  const lat0 = (minLat + maxLat) / 2;
  const lonSpan = (maxLon - minLon) * Math.cos((lat0 * Math.PI) / 180);
  const k = MAP_WIDTH / (lonSpan || 1);
  proj = { lon0, lat0, k };
}

// ---------------------------------------------------------------------------
// データ読み込み
// ---------------------------------------------------------------------------
const datasets = {};    // ds -> [{name, addr, org, avg, max, latest, latestYear, x, z}]
let regionOutline = null;   // LineSegments(アウトライン)
let regionFilled = null;    // Group(塗り分け面)

async function loadAll() {
  const [maxdepth, snowfall, gosetsu] = await Promise.all([
    fetch("./data/stations_maxdepth.geojson").then((r) => r.json()),
    fetch("./data/stations_snowfall.geojson").then((r) => r.json()),
    fetch("./data/gosetsu.geojson").then((r) => r.json()),
  ]);

  // 全データの経度緯度範囲を求める
  const b = { minLon: Infinity, maxLon: -Infinity, minLat: Infinity, maxLat: -Infinity };
  const scan = (lon, lat) => {
    if (lon < b.minLon) b.minLon = lon;
    if (lon > b.maxLon) b.maxLon = lon;
    if (lat < b.minLat) b.minLat = lat;
    if (lat > b.maxLat) b.maxLat = lat;
  };
  for (const fc of [maxdepth, snowfall]) {
    for (const f of fc.features) scan(f.geometry.coordinates[0], f.geometry.coordinates[1]);
  }
  computeProjection(b);

  // 観測点を配列化(投影座標付き)
  for (const [ds, fc] of [["maxdepth", maxdepth], ["snowfall", snowfall]]) {
    datasets[ds] = fc.features.map((f) => {
      const [lon, lat] = f.geometry.coordinates;
      const [x, z] = project(lon, lat);
      const p = f.properties;
      return {
        name: p.name, addr: p.addr, org: p.org,
        avg: p.avg, max: p.max, latest: p.latest, latestYear: p.latestYear,
        years: p.years,
        x, z,
      };
    });
  }

  buildRegions(gosetsu);
}

// 指定区域ポリゴンを (a) アウトライン (b) 豪雪区分で塗り分けた面 として描く
function buildRegions(gosetsu) {
  const OUTLINE_Y = 0.06;
  const FILL_Y = 0.03;
  const outlinePos = [];
  // 塗り分けは豪雪区分ごとに1メッシュへ集約(描画コール数を抑える)
  const acc = { "1": { pos: [], idx: [] }, "2": { pos: [], idx: [] } };

  const addOutline = (ring) => {
    for (let i = 0; i < ring.length - 1; i++) {
      const [ax, az] = project(ring[i][0], ring[i][1]);
      const [bx, bz] = project(ring[i + 1][0], ring[i + 1][1]);
      outlinePos.push(ax, OUTLINE_Y, az, bx, OUTLINE_Y, bz);
    }
  };

  // 1ポリゴン(外周 + 穴)を三角形分割し、対象の acc へ追記
  const addFilled = (rings, a) => {
    const toVec2 = (ring) =>
      ring.map(([lon, lat]) => { const [x, z] = project(lon, lat); return new THREE.Vector2(x, z); });
    const shape = new THREE.Shape(toVec2(rings[0]));
    for (let i = 1; i < rings.length; i++) shape.holes.push(new THREE.Path(toVec2(rings[i])));
    const g = new THREE.ShapeGeometry(shape); // (x, y, 0) を生成
    const p = g.attributes.position.array;
    const idx = g.index ? g.index.array : null;
    const base = a.pos.length / 3;
    for (let i = 0; i < p.length; i += 3) a.pos.push(p[i], FILL_Y, p[i + 1]); // (x, H, z)
    if (idx) for (let i = 0; i < idx.length; i++) a.idx.push(idx[i] + base);
    g.dispose();
  };

  for (const f of gosetsu.features) {
    const g = f.geometry;
    if (!g) continue;
    const div = String((f.properties && f.properties.A22_009) || "1");
    const a = acc[div] || acc["1"];
    const polys = g.type === "MultiPolygon" ? g.coordinates
      : g.type === "Polygon" ? [g.coordinates] : [];
    for (const poly of polys) {
      for (const ring of poly) addOutline(ring);
      if (poly.length) addFilled(poly, a);
    }
  }

  // (a) アウトライン
  const og = new THREE.BufferGeometry();
  og.setAttribute("position", new THREE.Float32BufferAttribute(outlinePos, 3));
  regionOutline = new THREE.LineSegments(
    og,
    new THREE.LineBasicMaterial({ color: 0x3f6bb0, transparent: true, opacity: 0.55 })
  );
  scene.add(regionOutline);

  // (b) 塗り分け面
  regionFilled = new THREE.Group();
  for (const div of ["1", "2"]) {
    const a = acc[div];
    if (!a.pos.length) continue;
    const fg = new THREE.BufferGeometry();
    fg.setAttribute("position", new THREE.Float32BufferAttribute(a.pos, 3));
    fg.setIndex(a.idx);
    const mesh = new THREE.Mesh(
      fg,
      new THREE.MeshBasicMaterial({
        color: REGION_FILL[div], transparent: true, opacity: 0.4, side: THREE.DoubleSide,
        depthWrite: false,
      })
    );
    regionFilled.add(mesh);
  }
  scene.add(regionFilled);

  applyRegionMode();
}

function applyRegionMode() {
  const m = state.regionMode;
  if (regionOutline) regionOutline.visible = m === "outline" || m === "filled";
  if (regionFilled) regionFilled.visible = m === "filled";
}

// ---------------------------------------------------------------------------
// カラム(InstancedMesh)
// ---------------------------------------------------------------------------
let bars = null;
let allCurrent = [];    // 現データセット×指標で値を持つ全観測点
let current = [];       // 高さフィルタ通過後・実際に描画中の観測点
let currentMax = 1;     // 現在の指標の最大値(フィルタと無関係な全体最大)
let selected = null;    // 選択中の観測点(オブジェクト参照)
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

const barGeo = new THREE.CylinderGeometry(BAR_RADIUS, BAR_RADIUS, 1, 10);
const barMat = new THREE.MeshStandardMaterial({
  roughness: 0.45, metalness: 0.05, vertexColors: false,
});

// 選択マーカー(選択中カラムの頂上に浮かぶ発光球)
const markerMat = new THREE.MeshStandardMaterial({
  color: HIGHLIGHT, emissive: HIGHLIGHT, emissiveIntensity: 0.9, roughness: 0.3,
});
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 12), markerMat);
marker.visible = false;
scene.add(marker);

function valueOf(d) {
  const v = d[state.metric];
  return typeof v === "number" && isFinite(v) ? v : null;
}
function heightOf(v) {
  return Math.max(0.4, v * (TARGET_MAX_HEIGHT / currentMax));
}

function rebuildBars() {
  allCurrent = (datasets[state.dataset] || []).filter((d) => valueOf(d) != null);
  currentMax = allCurrent.reduce((m, d) => Math.max(m, valueOf(d)), 1);
  current = allCurrent.filter((d) => valueOf(d) >= state.threshold);

  if (bars) { scene.remove(bars); bars.dispose?.(); }

  bars = new THREE.InstancedMesh(barGeo, barMat, current.length);
  bars.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  for (let i = 0; i < current.length; i++) {
    const d = current[i];
    const v = valueOf(d);
    const h = heightOf(v);
    dummy.position.set(d.x, h / 2, d.z);
    dummy.scale.set(1, h, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    bars.setMatrixAt(i, dummy.matrix);
    if (d === selected) tmpColor.set(HIGHLIGHT);
    else rampColor(v / currentMax, tmpColor);
    bars.setColorAt(i, tmpColor);
  }
  bars.instanceMatrix.needsUpdate = true;
  if (bars.instanceColor) bars.instanceColor.needsUpdate = true;
  scene.add(bars);

  updateMarker();
  updateLegend();
}

// 選択マーカーの位置を現在の描画状態に合わせて更新
function updateMarker() {
  if (selected && current.includes(selected)) {
    const v = valueOf(selected);
    marker.position.set(selected.x, heightOf(v) + 1.8, selected.z);
    marker.visible = true;
  } else {
    marker.visible = false;
  }
}

// ---------------------------------------------------------------------------
// 凡例
// ---------------------------------------------------------------------------
function updateLegend() {
  const unit = "cm";
  document.getElementById("legend-title").textContent =
    `${DS_LABEL[state.dataset]}・${METRIC_LABEL[state.metric]} (${unit})`;
  document.getElementById("tick-min").textContent = "0";
  document.getElementById("tick-mid").textContent =
    Math.round(currentMax / 2).toLocaleString();
  document.getElementById("tick-max").textContent =
    Math.round(currentMax).toLocaleString();
  const total = allCurrent.length, shown = current.length;
  document.getElementById("legend-count").textContent =
    shown === total
      ? `${total.toLocaleString()} 地点`
      : `${shown.toLocaleString()} / ${total.toLocaleString()} 地点(フィルタ中)`;
}

// ---------------------------------------------------------------------------
// ホバー(レイキャスト)
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const tooltip = document.getElementById("tooltip");
let hoverId = -1;
let pointerInside = false;

function onPointerMove(e) {
  pointerInside = true;
  pointer.px = e.clientX;
  pointer.py = e.clientY;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
}
renderer.domElement.addEventListener("pointermove", onPointerMove);
renderer.domElement.addEventListener("pointerleave", () => {
  pointerInside = false;
  hoverId = -1;
  tooltip.classList.remove("show");
});

function updateHover() {
  if (!pointerInside || !bars) return;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(bars);
  if (hits.length && hits[0].instanceId != null) {
    const id = hits[0].instanceId;
    if (id !== hoverId) {
      hoverId = id;
      const d = current[id];
      const v = valueOf(d);
      tooltip.querySelector(".tt-name").textContent = d.name || "(名称不明)";
      tooltip.querySelector(".tt-val").textContent =
        `${Math.round(v).toLocaleString()} cm — ${DS_LABEL[state.dataset]}・${METRIC_LABEL[state.metric]}`;
      const yr = state.metric === "latest" && d.latestYear ? `(${d.latestYear}年度) ` : "";
      tooltip.querySelector(".tt-sub").textContent =
        `${yr}${d.addr || ""}${d.org ? " / " + d.org : ""}`;
    }
    tooltip.style.left = pointer.px + 14 + "px";
    tooltip.style.top = pointer.py + 14 + "px";
    tooltip.classList.add("show");
  } else {
    hoverId = -1;
    tooltip.classList.remove("show");
  }
}

// ---------------------------------------------------------------------------
// 選択(クリックで固定)
// ---------------------------------------------------------------------------
const detailEl = document.getElementById("detail");

function setBarColorFor(d) {
  if (!bars) return;
  const i = current.indexOf(d);
  if (i < 0) return;
  if (d === selected) tmpColor.set(HIGHLIGHT);
  else rampColor(valueOf(d) / currentMax, tmpColor);
  bars.setColorAt(i, tmpColor);
  bars.instanceColor.needsUpdate = true;
}

function selectStation(d) {
  if (!d) return;
  const prev = selected;
  selected = d;
  if (prev) setBarColorFor(prev);
  setBarColorFor(d);
  updateMarker();
  showDetail(d);
}

function clearSelection() {
  const prev = selected;
  selected = null;
  if (prev) setBarColorFor(prev);
  marker.visible = false;
  detailEl.classList.remove("show");
}

function showDetail(d) {
  detailEl.querySelector(".d-name").textContent = d.name || "(名称不明)";
  detailEl.querySelector(".d-sub").textContent =
    `${DS_LABEL[state.dataset]} ・ ${d.addr || ""}${d.org ? " / " + d.org : ""}`;
  const rows = [
    ["累年平均", d.avg, "avg"],
    ["累年最大", d.max, "max"],
    [`最新年${d.latestYear ? "(" + d.latestYear + "年度)" : ""}`, d.latest, "latest"],
    ["観測年数", d.years != null ? d.years + " 年" : null, null],
  ];
  detailEl.querySelector("#detail-rows").innerHTML = rows
    .map(([k, v, metric]) => {
      const disp = v == null ? "—" : metric ? Math.round(v).toLocaleString() + " cm" : v;
      const hl = metric && metric === state.metric ? " hl" : "";
      return `<tr><td class="k">${k}</td><td class="v${hl}">${disp}</td></tr>`;
    })
    .join("");
  detailEl.classList.add("show");
}

document.getElementById("detail-close").addEventListener("click", clearSelection);

// ドラッグと区別してクリックのみ選択に使う
let downX = 0, downY = 0;
renderer.domElement.addEventListener("pointerdown", (e) => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6 || !bars) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(bars);
  if (hits.length && hits[0].instanceId != null) selectStation(current[hits[0].instanceId]);
  else clearSelection();
});

// ---------------------------------------------------------------------------
// UI 配線
// ---------------------------------------------------------------------------
function wireSeg(id, key, onChange) {
  const el = document.getElementById(id);
  el.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...el.children].forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    onChange(btn.dataset[key]);
  });
}

function syncThreshold() {
  const thr = document.getElementById("thr");
  thr.max = Math.max(1, Math.ceil(currentMax));
  thr.value = state.threshold;
  document.getElementById("thr-val").textContent = Math.round(state.threshold).toLocaleString();
}

wireSeg("seg-dataset", "ds", (v) => {
  state.dataset = v;
  clearSelection();          // データセットごとに観測点オブジェクトが別なので解除
  state.threshold = 0;
  rebuildBars();
  syncThreshold();
});
wireSeg("seg-metric", "metric", (v) => {
  state.metric = v;
  state.threshold = 0;
  rebuildBars();
  syncThreshold();
  if (selected) showDetail(selected); // ハイライト行を更新
});
wireSeg("seg-regions", "mode", (v) => { state.regionMode = v; applyRegionMode(); });

document.getElementById("thr").addEventListener("input", (e) => {
  state.threshold = Number(e.target.value);
  document.getElementById("thr-val").textContent = Math.round(state.threshold).toLocaleString();
  rebuildBars();
});

document.getElementById("chk-rotate").addEventListener("change", (e) => {
  state.autoRotate = e.target.checked;
  controls.autoRotate = state.autoRotate;
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// ループ
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateHover();
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// 起動
// ---------------------------------------------------------------------------
(async function init() {
  try {
    await loadAll();
    rebuildBars();
    syncThreshold();
    document.getElementById("loading").classList.add("hide");
    animate();
  } catch (err) {
    console.error(err);
    document.getElementById("loading-text").textContent =
      "データの読み込みに失敗しました: " + (err && err.message ? err.message : err);
  }
})();
</script>
</body>
</html>
