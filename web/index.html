<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>日本の豪雪地帯マップ(2016年度)</title>
<link
  href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css"
  rel="stylesheet"
/>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page-plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border-hairline: rgba(11, 11, 11, 0.1);
    --gosetsu: #86b6ef; /* 豪雪地帯（区分1） sequential blue step 250 */
    --tokubetsu: #1c5cab; /* 特別豪雪地帯（区分2） sequential blue step 550 */
    --gosetsu-line: #5598e7;
    --tokubetsu-line: #104281;
    --hover-outline: #0b0b0b;
    /* 観測点用シーケンシャル配色(寒色系・aqua)。ポリゴンのblueと区別がつくよう
       別の一色相ランプを採用。値: scripts/build-stations.sh の avg(累年平均)を
       dataviz スキルの validate_palette.js --ordinal で検証済み(light/dark両モードPASS)。 */
    --station-1: #53bb8d; /* aqua ramp step 300 (低い値) */
    --station-2: #00a368; /* aqua ramp step 400 */
    --station-3: #00844f; /* aqua ramp step 500 */
    --station-4: #00653a; /* aqua ramp step 600 (高い値) */
    --station-stroke: #fcfcfb;
    --title-h: 60px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Yu Gothic", sans-serif;
    color: var(--text-primary);
    background: var(--page-plane);
  }

  #map {
    position: absolute;
    inset: 0;
  }

  .panel {
    position: absolute;
    z-index: 2;
    background: var(--surface-1);
    border: 1px solid var(--border-hairline);
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(11, 11, 11, 0.12);
  }

  #title-panel {
    top: 12px;
    left: 12px;
    padding: 12px 16px;
    max-width: 320px;
  }

  #title-panel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  #title-panel h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
  }

  #title-panel p {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  #title-toggle {
    display: none;
    flex: none;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    background: var(--surface-1);
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
  }

  /* ── 言語切替 ───────────────────────────────────── */
  #lang-switch-panel {
    position: absolute;
    z-index: 4;
    top: 12px;
    right: 54px;
  }

  #lang-switch-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 36px;
    padding: 0 10px;
    background: var(--surface-1);
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(11, 11, 11, 0.12);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-primary);
    cursor: pointer;
  }

  #lang-menu {
    position: absolute;
    z-index: 6;
    top: 100%;
    right: 0;
    margin-top: 6px;
    display: none;
    min-width: 150px;
    background: var(--surface-1);
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(11, 11, 11, 0.18);
    overflow: hidden;
  }

  #lang-menu.open {
    display: block;
  }

  .lang-option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    font-size: 13px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-primary);
    min-height: 38px;
  }

  .lang-option:hover {
    background: rgba(11, 11, 11, 0.05);
  }

  .lang-option[aria-current="true"] {
    font-weight: 700;
    color: var(--tokubetsu);
  }

  /* ── レイヤー切替アイコンボタン(モバイルのみ表示) ───────────── */
  #layer-toggle-btn {
    display: none;
    position: absolute;
    z-index: 4;
    align-items: center;
    justify-content: center;
    background: var(--surface-1);
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(11, 11, 11, 0.12);
    font-size: 16px;
    cursor: pointer;
  }

  #legend-panel {
    bottom: 28px;
    left: 12px;
    font-size: 12px;
    max-width: 220px;
  }

  #legend-panel-header {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    cursor: pointer;
    user-select: none;
  }

  #legend-panel-header h2 {
    margin: 0;
    font-size: 12.5px;
    font-weight: 700;
  }

  #legend-panel-header .chevron {
    font-size: 11px;
    color: var(--text-secondary);
    transition: transform 0.15s ease;
  }

  #legend-panel.collapsed #legend-panel-header .chevron {
    transform: rotate(-90deg);
  }

  #legend-body {
    padding: 10px 14px;
  }

  #legend-panel.collapsed #legend-body {
    display: none;
  }

  .legend-block + .legend-block {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border-hairline);
  }

  .legend-title {
    font-weight: 700;
    font-size: 12px;
    margin-bottom: 6px;
    color: var(--text-primary);
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex: none;
    border: 1px solid var(--border-hairline);
  }

  .legend-dot {
    border-radius: 50%;
    flex: none;
    border: 1px solid var(--border-hairline);
    background: var(--surface-1);
  }

  .legend-row span.label {
    color: var(--text-primary);
    font-size: 11px;
  }

  /* ── レイヤー切替パネル ───────────────────────────── */
  #layer-switch-panel {
    top: 96px;
    right: 12px;
    padding: 10px 14px;
    font-size: 12px;
    width: 200px;
  }

  #layer-switch-panel .section-title {
    font-weight: 700;
    font-size: 11px;
    color: var(--text-secondary);
    margin: 8px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  #layer-switch-panel .section-title:first-child {
    margin-top: 0;
  }

  .switch-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
    cursor: pointer;
  }

  .switch-row input {
    accent-color: var(--tokubetsu);
    flex: none;
  }

  .switch-row span {
    font-size: 12.5px;
    color: var(--text-primary);
  }

  /* ── 都道府県別集計パネル ───────────────────────────── */
  /* top はタイトルパネルの実測高さ(--title-h、JSで言語切替のたびに再計算)
     に追随させる。言語によってタイトル・説明文の長さが変わり折り返し行数が
     変わっても、下のパネルと重ならないようにするため。 */
  #pref-panel {
    top: calc(var(--title-h, 164px) + 16px);
    left: 12px;
    width: 260px;
    max-height: calc(100vh - var(--title-h, 164px) - 340px);
    min-height: 42px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #pref-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    flex: none;
  }

  #pref-panel-header h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
  }

  #pref-panel-header .chevron {
    font-size: 11px;
    color: var(--text-secondary);
    transition: transform 0.15s ease;
  }

  #pref-panel.collapsed #pref-panel-header .chevron {
    transform: rotate(-90deg);
  }

  #pref-panel-body {
    overflow-y: auto;
    padding: 0 10px 10px;
    flex: 1 1 auto;
  }

  #pref-panel.collapsed #pref-panel-body {
    display: none;
  }

  #pref-panel-body .pref-hint {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 4px 6px;
    line-height: 1.5;
  }

  .pref-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 5px 4px;
    border-radius: 6px;
    cursor: pointer;
  }

  .pref-row:hover {
    background: rgba(11, 11, 11, 0.05);
  }

  .pref-row-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12px;
  }

  .pref-row-name {
    font-weight: 600;
    color: var(--text-primary);
  }

  .pref-row-count {
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    font-size: 11.5px;
  }

  .pref-bar-track {
    height: 6px;
    border-radius: 3px;
    background: color-mix(in srgb, var(--gosetsu) 30%, var(--surface-1));
    overflow: hidden;
  }

  .pref-bar-fill {
    height: 100%;
    background: var(--tokubetsu);
    border-radius: 3px 0 0 3px;
  }

  .pref-row-sub {
    font-size: 10.5px;
    color: var(--text-muted);
  }

  #source-panel {
    bottom: 8px;
    right: 8px;
    padding: 6px 10px;
    font-size: 11px;
    color: var(--text-secondary);
    background: rgba(252, 252, 251, 0.9);
    box-shadow: none;
    border-radius: 6px;
  }

  #source-panel a {
    color: var(--text-secondary);
    text-decoration: underline;
  }

  #source-panel a:hover {
    color: var(--text-primary);
  }

  .maplibregl-popup-content {
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Yu Gothic", sans-serif;
    padding: 12px 14px;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(11, 11, 11, 0.18);
  }

  .popup-pref {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }

  .popup-city {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .popup-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .popup-note {
    font-size: 11px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border-hairline);
    margin-top: 6px;
    padding-top: 6px;
    line-height: 1.5;
  }

  .popup-station-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
  }

  .popup-station-addr {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .popup-stat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .popup-stat-table td {
    padding: 2.5px 0;
  }

  .popup-stat-table td.k {
    color: var(--text-secondary);
    padding-right: 10px;
    white-space: nowrap;
  }

  .popup-stat-table td.v {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    font-weight: 600;
  }

  #loading {
    position: absolute;
    z-index: 3;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 1px solid var(--border-hairline);
    border-radius: 8px;
    padding: 10px 16px;
  }

  @media (max-width: 640px) {
    /* タイトル: コンパクト化。説明はタップで開くドロップダウン表示に */
    #title-panel {
      padding: 8px 12px;
      max-width: calc(100% - 96px);
    }
    #title-panel h1 {
      font-size: 13.5px;
      line-height: 1.3;
    }
    #title-panel p {
      display: none;
    }
    #title-panel.expanded {
      z-index: 5;
    }
    #title-panel.expanded p {
      display: block;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin: 6px 0 0;
      padding: 10px 14px;
      background: var(--surface-1);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(11, 11, 11, 0.15);
      font-size: 12px;
      line-height: 1.5;
    }
    #title-toggle {
      display: flex;
    }

    /* 言語切替・レイヤー切替アイコンは右上に縦に並べる */
    #lang-switch-panel {
      top: 12px;
      right: 12px;
    }
    #layer-toggle-btn {
      display: flex;
      top: 60px;
      right: 12px;
      width: 40px;
      height: 40px;
    }

    /* ズームコントロールは非表示にしてスペースを確保(ピンチ操作は可能) */
    .maplibregl-ctrl-top-right {
      display: none;
    }

    /* レイヤー切替パネル: アイコンボタンで開閉するオーバーレイに */
    #layer-switch-panel {
      display: none;
      top: 108px;
      right: 12px;
      width: 200px;
      max-width: calc(100% - 24px);
    }
    #layer-switch-panel.open {
      display: block;
      z-index: 4;
    }

    /* 都道府県パネル: タイトル直下に配置し、デフォルト折りたたみ。
       right を明示して、右上の言語・レイヤー切替ボタン列の下に
       もぐり込まないようにする(left+width指定だと言語切替後の
       ボタン幅変化に追随できないため)。 */
    #pref-panel {
      top: calc(var(--title-h, 60px) + 16px);
      left: 12px;
      right: 100px;
      width: auto;
      max-height: 40vh;
    }

    /* 凡例: 折りたたみヘッダーを表示し、デフォルト折りたたみ。
       出典表記(#source-panel)は最大3行程度まで折り返しうるため、
       重ならないよう十分な余白を確保する。 */
    #legend-panel {
      bottom: 84px;
      left: 12px;
      max-width: calc(100% - 24px);
    }
    #legend-panel-header {
      display: flex;
    }

    #source-panel {
      left: 12px;
      right: 12px;
      font-size: 10.5px;
    }

    /* タップターゲットの拡大 */
    .switch-row {
      min-height: 44px;
    }
    .switch-row input[type="checkbox"],
    .switch-row input[type="radio"] {
      width: 20px;
      height: 20px;
    }
    #pref-panel-header,
    #legend-panel-header {
      min-height: 44px;
    }
    .pref-row {
      min-height: 44px;
      justify-content: center;
    }
    #lang-switch-btn {
      min-height: 40px;
    }
    .lang-option {
      min-height: 44px;
      display: flex;
      align-items: center;
    }
  }

  @media (max-width: 380px) {
    .maplibregl-popup {
      max-width: calc(100vw - 32px) !important;
    }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="title-panel" class="panel">
  <div id="title-panel-row">
    <h1 data-i18n="meta.title">日本の豪雪地帯マップ(2016年度)</h1>
    <button
      id="title-toggle"
      type="button"
      aria-expanded="false"
      data-i18n-aria="title.toggleAria"
    >▾</button>
  </div>
  <p data-i18n="meta.description">
    国土数値情報「豪雪地帯データ」(A22-2016)・「豪雪地帯データ(気象データ等)」(A22-m-14)をもとにした、豪雪地帯・特別豪雪地帯の指定区域と気象観測点の可視化です。
  </p>
</div>

<div id="lang-switch-panel">
  <button
    id="lang-switch-btn"
    type="button"
    aria-haspopup="true"
    aria-expanded="false"
    data-i18n-aria="lang.buttonAria"
  >
    <span aria-hidden="true">🌐</span><span id="lang-switch-code">JA</span>
  </button>
  <div id="lang-menu" role="menu">
    <button class="lang-option" type="button" role="menuitem" data-lang="ja">日本語</button>
    <button class="lang-option" type="button" role="menuitem" data-lang="en">English</button>
    <button class="lang-option" type="button" role="menuitem" data-lang="zh-Hans">简体中文</button>
    <button class="lang-option" type="button" role="menuitem" data-lang="ko">한국어</button>
  </div>
</div>

<button
  id="layer-toggle-btn"
  type="button"
  aria-expanded="false"
  aria-controls="layer-switch-panel"
  data-i18n-aria="layers.toggleAria"
><span aria-hidden="true">🗺️</span></button>

<div id="layer-switch-panel" class="panel">
  <div class="section-title" data-i18n="layers.sectionArea">指定区域</div>
  <label class="switch-row">
    <input type="checkbox" id="toggle-gosetsu" checked />
    <span data-i18n="layers.togglePolygon">豪雪地帯ポリゴンを表示</span>
  </label>

  <div class="section-title" data-i18n="layers.sectionStation">観測点</div>
  <label class="switch-row">
    <input type="radio" name="station-mode" value="none" checked />
    <span data-i18n="layers.stationNone">なし</span>
  </label>
  <label class="switch-row">
    <input type="radio" name="station-mode" value="maxdepth" />
    <span data-i18n="layers.stationMaxdepth">最深積雪(累年平均)</span>
  </label>
  <label class="switch-row">
    <input type="radio" name="station-mode" value="snowfall" />
    <span data-i18n="layers.stationSnowfall">累計降雪量(累年平均)</span>
  </label>
</div>

<div id="pref-panel" class="panel">
  <div id="pref-panel-header">
    <h2 data-i18n="prefPanel.title">都道府県別 指定市区町村数</h2>
    <span class="chevron">▾</span>
  </div>
  <div id="pref-panel-body">
    <div class="pref-hint" data-i18n="prefPanel.hint">行をクリックすると地図がその都道府県へ移動します。</div>
    <div id="pref-list"></div>
  </div>
</div>

<div id="legend-panel" class="panel">
  <div id="legend-panel-header">
    <h2 data-i18n="legend.panelHeading">凡例</h2>
    <span class="chevron">▾</span>
  </div>
  <div id="legend-body"></div>
</div>

<div id="source-panel" class="panel">
  <span data-i18n="source.label">出典:</span>
  <a
    href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A22-2016.html"
    target="_blank"
    rel="noopener"
    data-i18n="source.datasetArea"
    >豪雪地帯データ(A22-2016)</a
  >・<a
    href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A22-m.html"
    target="_blank"
    rel="noopener"
    data-i18n="source.datasetMet"
    >豪雪地帯データ(気象データ等)(A22-m-14)</a
  >
  <span data-i18n="source.org">国土交通省</span>
</div>

<div id="loading" data-i18n="loading.text">地図データを読み込み中...</div>

<script>
  // ══════════════════════════════════════════════════════════════
  // 多言語対応(i18n)
  // ══════════════════════════════════════════════════════════════
  const I18N = {
    ja: {
      meta: {
        title: "日本の豪雪地帯マップ(2016年度)",
        description:
          "国土数値情報「豪雪地帯データ」(A22-2016)・「豪雪地帯データ(気象データ等)」(A22-m-14)をもとにした、豪雪地帯・特別豪雪地帯の指定区域と気象観測点の可視化です。",
      },
      title: { toggleAria: "説明の表示・非表示を切り替え" },
      layers: {
        sectionArea: "指定区域",
        togglePolygon: "豪雪地帯ポリゴンを表示",
        sectionStation: "観測点",
        stationNone: "なし",
        stationMaxdepth: "最深積雪(累年平均)",
        stationSnowfall: "累計降雪量(累年平均)",
        toggleAria: "レイヤー切替を開く",
      },
      legend: {
        panelHeading: "凡例",
        polygonTitle: "凡例(豪雪区分)",
        gosetsu: "豪雪地帯",

    en: { native: "English", short: "EN" },

  const LOCALE_MAP = {
    ja: "ja-JP",
    en: "en-US",
    "zh-Hans": "zh-Hans-CN",
    ko: "ko-KR",
  };

  function normalizeLang(raw) {
    if (!raw) return null;
    const s = String(raw).toLowerCase();
    if (s.startsWith("ja")) return "ja";
    if (s.startsWith("zh")) return "zh-Hans";
    if (s.startsWith("ko")) return "ko";
    if (s.startsWith("en")) return "en";
    return null;
  }

  function detectLang() {
    const params = new URLSearchParams(location.search);
    const fromUrl = normalizeLang(params.get("lang"));
    if (fromUrl) {
      try {
        localStorage.setItem("lang", fromUrl);
      } catch (e) {
        /* localStorage unavailable: ignore */
      }
      return fromUrl;
    }
    let stored = null;
    try {
      stored = normalizeLang(localStorage.getItem("lang"));
    } catch (e) {
      stored = null;
    }
    if (stored) return stored;
    const fromNav = normalizeLang(
      (navigator.languages && navigator.languages[0]) || navigator.language
    );
    return fromNav || "en";
  }

  function getPath(obj, path) {
    return path
      .split(".")
      .reduce((acc, k) => (acc && acc[k] !== undefined ? acc[k] : undefined), obj);
  }

  function t(key, ...args) {
    let val = getPath(I18N[currentLang], key);
    if (val === undefined) val = getPath(I18N.en, key);
    if (val === undefined) return key;
    return typeof val === "function" ? val(...args) : val;
  }

  function prefName(ja) {
    if (currentLang === "ja") return ja;
    const entry = PREF_NAMES[ja];
    return (entry && entry[currentLang]) || ja;
  }

  // 観測機関名(station.org)の翻訳。
  // 1) ORG_NAMESに完全一致する機関名(気象庁・整備局・国道事務所等)はそれを使用
  // 2) PREF_NAMESに完全一致する都道府県名は流用(enのみ「Prefecture」を付与、
  //    北海道は例外でそのまま)
  // 3) それ以外(市区町村名、「滋賀県長浜市」のような複合名など)は
  //    翻訳データがないため原文(日本語)のままフォールバック
  function orgName(ja) {
    if (!ja) return ja;
    if (currentLang === "ja") return ja;
    const org = ORG_NAMES[ja];
    if (org && org[currentLang]) return org[currentLang];
    const pref = PREF_NAMES[ja];
    if (pref && pref[currentLang]) {
      if (currentLang === "en" && ja !== "北海道") {
        return pref[currentLang] + " Prefecture";
      }
      return pref[currentLang];
    }
    return ja;
  }

  function applyStaticI18n() {
    document.documentElement.lang = currentLang;
    document.title = t("meta.title");
    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const val = t(el.getAttribute("data-i18n"));
      if (typeof val === "string") el.textContent = val;
    });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
      const val = t(el.getAttribute("data-i18n-aria"));
      if (typeof val === "string") el.setAttribute("aria-label", val);
    });
  }

  function updateLangSwitchUI() {
    const codeEl = document.getElementById("lang-switch-code");
    if (codeEl) codeEl.textContent = LANG_META[currentLang].short;
    document.querySelectorAll(".lang-option").forEach((btn) => {
      btn.setAttribute(
        "aria-current",
        btn.dataset.lang === currentLang ? "true" : "false"
      );
    });
  }

  function syncTitleHeight() {
    const el = document.getElementById("title-panel");
    if (!el) return;
    document.documentElement.style.setProperty("--title-h", el.offsetHeight + "px");
  }

  function isMobileView() {
    return window.innerWidth <= 640;

  // モバイル幅では画面が狭く、都道府県パネル・凡例・レイヤー切替・
  // タイトルの説明・言語メニューを同時に開くと重なりうる。そのため
  // 「ひとつ開いたら他は閉じる」の排他制御を行い、重なりを構造的に防ぐ。
  function closeMobileOverlays(except) {
    if (!isMobileView()) return;
    if (except !== "title") {
      document.getElementById("title-panel").classList.remove("expanded");
      document.getElementById("title-toggle").setAttribute("aria-expanded", "false");
      document.getElementById("title-toggle").textContent = "▾";

  // ── 観測点レイヤーの配色・スケール定義 ──────────────────────
  // dataviz スキルの「寒色系シーケンシャル(aqua)」ランプ(validate_palette.js
  // --ordinal で light/dark 両モード検証済み)。ポリゴンのblue 2色と区別が
  // つくよう別の一色相を採用している。
  const STATION_RAMP = ["#53bb8d", "#00a368", "#00844f", "#00653a"];

  const STATION_LAYERS = {
    maxdepth: {
      source: "stations-maxdepth",
      layer: "stations-maxdepth-circle",

      domain: [0, 50, 150, 350],
      radii: [3, 5, 8, 12],

      domain: [0, 300, 800, 2000],

  function buildRadiusExpression(domain, radii) {
    const small = radii.map((r) => Math.max(2, +(r * 0.6).toFixed(1)));
    const stopsSmall = [];
    const stopsLarge = [];
    domain.forEach((v, i) => {
      stopsSmall.push(v, small[i]);
      stopsLarge.push(v, radii[i]);
    });
    return [
      "interpolate",
      ["linear"],
      ["zoom"],
      3,
      ["interpolate", ["linear"], ["get", "avg"], ...stopsSmall],
      9,
      ["interpolate", ["linear"], ["get", "avg"], ...stopsLarge],
    ];
  }

  function buildColorExpression(domain, ramp) {
    const stops = [];
    domain.forEach((v, i) => {
      stops.push(v, ramp[i]);
    });
    return ["interpolate", ["linear"], ["get", "avg"], ...stops];
  }

  // ── 都道府県別集計パネル ───────────────────────────────
  function walkCoords(geom, fn) {
    if (!geom) return;
    if (geom.type === "Point") {
      fn(geom.coordinates);
    } else if (geom.type === "MultiPoint" || geom.type === "LineString") {
      geom.coordinates.forEach(fn);
    } else if (geom.type === "MultiLineString" || geom.type === "Polygon") {
      geom.coordinates.forEach((ring) => ring.forEach(fn));
    } else if (geom.type === "MultiPolygon") {
      geom.coordinates.forEach((poly) =>
        poly.forEach((ring) => ring.forEach(fn))
      );
    } else if (geom.type === "GeometryCollection") {
      (geom.geometries || []).forEach((g) => walkCoords(g, fn));
    }
  }

  function bboxOfFeatures(features) {
    let minX = Infinity,
      minY = Infinity,
      maxX = -Infinity,
      maxY = -Infinity;
    for (const f of features) {
      walkCoords(f.geometry, ([x, y]) => {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      });
    }
    if (!isFinite(minX)) return null;
    return [
      [minX, minY],
      [maxX, maxY],
    ];
  }

  function fetchPrefData(geojson) {
    const feats = (geojson && geojson.features) || [];

    // 都道府県ごとに { code -> hasTokubetsu, features[] } を集計
    const byPref = new Map();
    for (const f of feats) {
      const props = f.properties || {};
      const pref = props.A22_003 || "不明";
      const code = props.A22_002;
      const kubun = String(props.A22_009);

      if (!byPref.has(pref)) {
        byPref.set(pref, { codes: new Map(), features: [] });
      }
      const entry = byPref.get(pref);
      entry.features.push(f);
      if (code) {
        const hasTokubetsu = entry.codes.get(code) || false;
        entry.codes.set(code, hasTokubetsu || kubun === "2");
      }
    }

    prefBoundsIndex = new Map();
    const summary = [];
    for (const [pref, entry] of byPref.entries()) {
      const cityCount = entry.codes.size;
      let tokubetsuCount = 0;
      for (const v of entry.codes.values()) {
        if (v) tokubetsuCount++;
      }
      summary.push({
        pref,
        cityCount,
        tokubetsuCount,
        ratio: cityCount > 0 ? tokubetsuCount / cityCount : 0,
      });
      prefBoundsIndex.set(pref, bboxOfFeatures(entry.features));
    }

    summary.sort((a, b) => b.cityCount - a.cityCount);
    prefSummaryCache = summary;
    renderPrefList();
  }

  function renderPrefList() {
    if (!prefSummaryCache) return;
    const list = document.getElementById("pref-list");
    list.innerHTML = "";
    for (const row of prefSummaryCache) {
      const rowEl = document.createElement("div");
      rowEl.className = "pref-row";
      rowEl.tabIndex = 0;
      rowEl.setAttribute("role", "button");

      const top = document.createElement("div");
      top.className = "pref-row-top";
      const nameEl = document.createElement("span");
      nameEl.className = "pref-row-name";
      nameEl.textContent = prefName(row.pref);
      const countEl = document.createElement("span");
      countEl.className = "pref-row-count";
      countEl.textContent = t("prefPanel.cityCount", row.cityCount);
      top.appendChild(nameEl);
      top.appendChild(countEl);

      const track = document.createElement("div");
      track.className = "pref-bar-track";
      const fill = document.createElement("div");
      fill.className = "pref-bar-fill";
      fill.style.width = Math.round(row.ratio * 100) + "%";
      track.appendChild(fill);

      const sub = document.createElement("div");
      sub.className = "pref-row-sub";
      sub.textContent = t(
        "prefPanel.tokubetsuSub",
        row.tokubetsuCount,
        Math.round(row.ratio * 100)
      );

      rowEl.appendChild(top);
      rowEl.appendChild(track);
      rowEl.appendChild(sub);

      const goto = () => {
        const bounds = prefBoundsIndex && prefBoundsIndex.get(row.pref);
        if (bounds) {
          map.fitBounds(bounds, { padding: 60, duration: 600 });
        }
      };
      rowEl.addEventListener("click", goto);
      rowEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          goto();
        }
      });

      list.appendChild(rowEl);
    }
  }
</script>
</body>
</html>
